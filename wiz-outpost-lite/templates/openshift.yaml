{{- range $values := (include "wiz-outpost-lite.runners" . | fromJson) }}
{{- with merge $values (omit $ "Values") }}
{{- $needsElevatedScc := has "SYS_ADMIN" (dig "capabilities" "add" (list) .Values.containerSecurityContext) -}}
{{- if and .Values.enabled .Values.openshift $needsElevatedScc -}}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ include "wiz-outpost-lite.fullname" . }}-scc
  labels: {{- include "wiz-outpost-lite.labels" . | nindent 4 }}
allowHostDirVolumePlugin: true
allowPrivilegedContainer: true
readOnlyRootFilesystem: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
requiredDropCapabilities: null
groups: []
priority: 0
allowedCapabilities:
  - SYS_ADMIN
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - '*'
users:
- system:serviceaccount:{{ .Release.Namespace }}:{{ .Values.serviceAccount.name | default (printf "sa-%s" .runner) }}
volumes:
  - downwardAPI
  - emptyDir
  - hostPath
  - secret
---
{{- end }}
{{- end }}
{{- end }}
