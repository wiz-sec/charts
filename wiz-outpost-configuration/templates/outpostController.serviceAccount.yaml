{{- if .Values.outpostController.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.outpostController.serviceAccountName }}
  labels:
    {{- /*
      Use stable selectorLabels only — NOT the common "labels" helper. That helper adds
      helm.sh/chart (which embeds the chart version) and app.kubernetes.io/version, both of
      which change on every release. With them, `helm upgrade` computes a non-empty diff and
      PATCHes this ServiceAccount on every chart bump. The GCP provisioner GSA has
      create-but-not-update on serviceaccounts, so that PATCH fails (MissingPermissions).
      Version-stable labels mean Helm never has to modify this SA after it is first created.
    */}}
    {{- include "wiz-outpost-configuration.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: outpost-controller
{{- end }}