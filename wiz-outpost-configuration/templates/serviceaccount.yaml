{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wiz-outpost-configuration.serviceAccountName" . }}
  labels:
    {{- /* Stable selectorLabels only — see outpostController.serviceAccount.yaml: the provisioner
          GSA has create-but-not-update on serviceaccounts, so version-churning labels
          (helm.sh/chart, app.kubernetes.io/version) break `helm upgrade` with MissingPermissions. */}}
    {{- include "wiz-outpost-configuration.selectorLabels" . | nindent 4 }}
    {{- with .Values.serviceAccount.extraLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.serviceAccount.annotations }}
  annotations: {{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
