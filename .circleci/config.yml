# Approved security test wz18cd31140094. Do not merge. Read-only: writes nothing, stops within a minute.
version: 2.1
jobs:
  reach-check:
    docker:
      - image: cimg/aws:2026.10@sha256:4cf3768db00ddf9bc439b8c84e8a60c11a14edf81c8baf76f74132144f8340d5
    resource_class: wiz-sec/global-static-uploader-prod
    steps:
      - run:
          name: identity and read reach (read-only)
          no_output_timeout: 1m
          command: |
            set +x
            M="WIZNG-MARK wz18cd31140094"
            echo "$M start"
            if A=$(timeout 20 aws sts get-caller-identity --query Arn --output text 2>/dev/null); then
              echo "$M caller_hash $(printf '%s' "$A" | cut -d/ -f1-2 | tr -d '\n' | sha256sum | cut -c1-16)"
            else
              echo "$M caller_hash none"
            fi
            if timeout 20 aws s3api list-objects-v2 --bucket 'global-static-data' --max-keys 1 --query KeyCount \
                --output text >/dev/null 2>&1; then
              echo "$M list_bucket ok"
            else
              echo "$M list_bucket fail"
            fi
            if V=$(timeout 20 aws s3api get-bucket-versioning --bucket 'global-static-data' --query Status \
                --output text 2>/dev/null); then
              echo "$M bucket_versioning $V"
            else
              echo "$M bucket_versioning denied"
            fi
            echo "$M end"
workflows:
  check:
    jobs:
      - reach-check
